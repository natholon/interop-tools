[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interop-tools"
version = "0.1.0"
description = "Healthcare interoperability toolkit - HL7v2/C-CDA/EDI to FHIR transformation, validation, and test-data generation"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "hl7>=0.4.5",
    "fhir.resources>=8.3",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    # Fetches a published spec to confirm a transcribed table still
    # matches it. Deselected by default (`-m "not network"` is the
    # default addopts) so the suite stays offline and fast; run with
    # `pytest -m network` when a table is edited.
    "network: verifies a transcribed table against the live published source",
]
addopts = "-m 'not network'"
