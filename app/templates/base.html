<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}interop-tools{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>interop-tools</h1>
        <p class="subtitle">HL7v2 / C-CDA / X12 EDI &harr; FHIR conversion, validation, deduplication &amp; test-data generation</p>
    </header>
    <nav class="site-nav">
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Convert / Validate / Transform</a>
        <a href="/data-specification" class="{{ 'active' if request.url.path == '/data-specification' else '' }}">Data Specification</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
