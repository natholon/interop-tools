<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}interop-tools{% endblock %}</title>
    {# Declaring an icon is what stops the browser's own default request
       for /favicon.ico, which had no route and 404'd on every page load. #}
    <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body>
    <header>
        <h1>interop-tools</h1>
        <p class="subtitle">HL7v2 / C-CDA / X12 EDI &harr; FHIR conversion, validation, deduplication &amp; test-data generation</p>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
